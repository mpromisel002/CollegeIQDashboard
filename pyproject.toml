[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "college-fit-advisor"
version = "0.1.0"
description = "Windows desktop app that ranks colleges by academic and culture fit using live public data."
requires-python = ">=3.12"
license = { text = "Proprietary" }

[project.scripts]
cfa = "cfa.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cfa = ["py.typed", "ui/icon.png"]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012", "SIM105"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cfa.ui.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
qt_api = "pyside6"
markers = ["live: hits real network sources (skipped unless CFA_LIVE=1)"]

[tool.coverage.run]
source = ["cfa"]
omit = ["src/cfa/ui/*", "src/cfa/tools/*", "src/cfa/app.py", "src/cfa/__main__.py"]
