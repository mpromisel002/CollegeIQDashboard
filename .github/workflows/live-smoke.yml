name: Live smoke test

# Weekly run against the real sources to catch upstream changes early (PLAN Phase 6).
on:
  schedule:
    - cron: "17 9 * * 1"  # Mondays 09:17 UTC
  workflow_dispatch:
    inputs:
      registry_url:
        description: "Registry URL to test (leave empty for the default; point at a bad URL to test failure reporting)"
        required: false
        default: ""

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CFA_SCORECARD_API_KEY: ${{ secrets.SCORECARD_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Run live smoke
        id: smoke
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          ARGS="--baseline docs/coverage_baseline.json"
          if [ -n "${{ inputs.registry_url }}" ]; then ARGS="$ARGS --registry-url ${{ inputs.registry_url }} --require-remote-registry"; fi
          python -m cfa.tools.live_smoke $ARGS 2>&1 | tee smoke.log
      - name: Validate every registry document
        id: validate
        if: always()
        env:
          PYTHONPATH: src
        run: |
          set -o pipefail
          # --allow-blocked: some schools' firewalls answer GitHub's cloud runners with HTTP 403 while
          # serving the same file to normal networks. Those are listed as BLOCKED, not failed.
          python -m cfa.tools.validate_registry --allow-blocked 2>&1 | tee validate.log
      - name: Open an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const read = f => fs.existsSync(f) ? fs.readFileSync(f, 'utf8').slice(-6000) : '(no output)';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Live smoke test failed (${new Date().toISOString().slice(0, 10)})`,
              body: `An upstream source changed or a registry link broke.\n\nRun: ${run}\n\n` +
                    "### live_smoke\n```\n" + read('smoke.log') + "\n```\n" +
                    "### validate_registry\n```\n" + read('validate.log') + "\n```",
              labels: ['live-smoke'],
            }).catch(async () => {
              // the label may not exist yet; retry without it
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title: `Live smoke test failed (${new Date().toISOString().slice(0, 10)})`,
                body: `Run: ${run}`,
              });
            });
