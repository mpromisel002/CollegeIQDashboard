name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      CFA_NO_PROCESS_POOL: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src
      - name: Tests
        run: pytest -q --cov=cfa --cov-report=term --cov-report=xml
      - name: sources/ coverage >= 90%
        run: python -m coverage report --include="src/cfa/sources/*" --fail-under=90

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Build exe
        run: pyinstaller packaging/cfa.spec --noconfirm
      - name: No test files in the build
        shell: pwsh
        run: |
          $bad = Get-ChildItem dist/CollegeFitAdvisor -Recurse | Where-Object { $_.FullName -match '\\tests\\|fixtures' }
          if ($bad) { $bad | ForEach-Object { $_.FullName }; exit 1 }
      - name: Smoke-launch (--self-test)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/CollegeFitAdvisor/CollegeFitAdvisor.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Error "self-test exit code $($p.ExitCode)"; exit 1 }
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/CollegeFitAdvisor -DestinationPath CollegeFitAdvisor-win64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CollegeFitAdvisor-win64
          path: CollegeFitAdvisor-win64.zip
          retention-days: 14
